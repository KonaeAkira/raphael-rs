[package]
name = "raphael-dioxus"
version = "0.28.6"
edition = "2024"

[lints]
workspace = true

[dependencies]
raphael-sim = { workspace = true, features = ["serde"] }
raphael-solver = { workspace = true, features = ["serde"] }
raphael-data = { workspace = true, features = ["serde"] }
raphael-translations = { workspace = true }

dioxus = { version = "0.7.10", default-features = false, features = ["launch", "logger", "lib"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

rayon = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
ron = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["desktop"] }
tokio = { version = "1", features = ["time"] }
env_logger = "0.11.8"
directories = "6"
arboard = { version = "3", default-features = false }
include_dir = "0.7"
semver = "1.0"
self-replace = "1.5.0"
tempfile = "3.24.0"
ehttp = { version = "0.5.0", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1.7"
console_log = "1"
web-sys = { version = "0.3.85", features = [
    "Window",
    "Navigator",
    "Storage",
    "Clipboard",
    "Document",
    "Element",
    # Used by dioxus-web without enabling the feature itself
    "Location",
] }

[dev-dependencies]
expect-test = "1.5.1"
strum = "0.27"
