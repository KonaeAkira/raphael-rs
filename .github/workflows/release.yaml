name: Publish release assets

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies for Dioxus desktop
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Build
        run: cargo build --release --package raphael-gui
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "target/release/raphael-gui"
      - name: Upload Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/release/raphael-gui
          asset_name: Raphael_x86_64_linux
          asset_content_type: application/octet-stream

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --package raphael-gui
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "target/release/raphael-gui.exe"
      - name: Upload Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/release/raphael-gui.exe
          asset_name: Raphael_x86_64_windows.exe
          asset_content_type: application/octet-stream

  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append runtime requirements to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          if ! grep -qF '<!-- runtime-requirements -->' <<< "$body"; then
            printf '%s\n\n%s\n' "$body" "$(cat .github/RELEASE_TEMPLATE.md)" \
              | gh release edit "$TAG" --notes-file -
          fi
