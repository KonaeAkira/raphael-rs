name: Check commit

on:
  push:
    branches: ["preview", "main"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  MSRV: 1.92.0

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install system dependencies for Dioxus desktop
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Check that workspace builds with MSRV
        run: cargo +${{ env.MSRV }} check --workspace
      - name: Check for clippy warnings when building native version
        run: cargo clippy --workspace -- -Dwarnings
      - name: Check for clippy warnings when building web version
        run: cargo clippy --config ./.cargo/config_wasm.toml --package raphael-gui -- -Dwarnings

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check that workspace builds with MSRV
        run: cargo +${{ env.MSRV }} check --workspace

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install system dependencies for Dioxus desktop
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Run all tests
        run: cargo test --verbose --workspace
